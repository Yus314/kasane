[package]
name = "kasane-wasm-bench"
version = "0.7.0"
edition.workspace = true
license.workspace = true
autobenches = false

[lib]
bench = false

[dependencies]
wasmtime = "43"
wasmtime-wasi = "43"
anyhow = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# ADR-053 chunk 5: effect_yield bench measures SDK-side CPS overhead
# against the MockHandler reference yielder. Path dep — sdk is
# workspace-excluded so it's pulled in explicitly here.
kasane-plugin-sdk = { path = "../kasane-plugin-sdk" }

[[bench]]
name = "raw_overhead"
harness = false

[[bench]]
name = "data_crossing"
harness = false

[[bench]]
name = "component_model"
harness = false

[[bench]]
name = "realistic"
harness = false

[[bench]]
name = "effect_yield"
harness = false
