[package]
name = "kasane-wasm-color-preview"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["cdylib"]

[features]
# Match cursor-line: declare the feature so the SDK macro's
# `#[cfg(feature = "test-harness")]` branches don't trigger
# unexpected-cfg warnings even though color-preview's own tests do
# not use the harness.
test-harness = ["kasane-plugin-sdk/test-harness"]

[dependencies]
kasane-plugin-sdk = { path = "../../../kasane-plugin-sdk" }
wit-bindgen = "0.53"

[profile.release]
opt-level = "s"
lto = true
